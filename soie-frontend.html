<title>SOIE — Sistema Operacional de Inteligência Editorial</title>
<style>
  :root {
    --surface: #FAFAFA; --elevated: #FFFFFF; --border: #E2E2E6;
    --muted: #71717A; --fg: #18181B; --brand: #4F46E5; --brand-soft: #4F46E51a;
    --ok: #059669; --ok-soft: #05966915; --warn: #D97706; --warn-soft: #D9770615;
    --crit: #E11D48; --crit-soft: #E11D4815; --info: #0284C7; --info-soft: #0284C715;
    --violet: #7C3AED; --violet-soft: #7C3AED15;
    --radius: 12px; --shadow: 0 8px 24px -12px rgba(0,0,0,.25);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #0C0C0E; --elevated: #18181B; --border: #27272A;
      --muted: #A1A1AA; --fg: #F4F4F5; --brand: #818CF8; --brand-soft: #818CF81f;
      --ok: #34D399; --ok-soft: #34D39918; --warn: #FBBF24; --warn-soft: #FBBF2418;
      --crit: #FB7185; --crit-soft: #FB718518; --info: #38BDF8; --info-soft: #38BDF818;
      --violet: #A78BFA; --violet-soft: #A78BFA18; --shadow: 0 8px 28px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --surface: #0C0C0E; --elevated: #18181B; --border: #27272A;
    --muted: #A1A1AA; --fg: #F4F4F5; --brand: #818CF8; --brand-soft: #818CF81f;
    --ok: #34D399; --ok-soft: #34D39918; --warn: #FBBF24; --warn-soft: #FBBF2418;
    --crit: #FB7185; --crit-soft: #FB718518; --info: #38BDF8; --info-soft: #38BDF818;
    --violet: #A78BFA; --violet-soft: #A78BFA18; --shadow: 0 8px 28px -10px rgba(0,0,0,.6);
  }
  :root[data-theme="light"] {
    --surface: #FAFAFA; --elevated: #FFFFFF; --border: #E2E2E6;
    --muted: #71717A; --fg: #18181B; --brand: #4F46E5; --brand-soft: #4F46E51a;
    --ok: #059669; --ok-soft: #05966915; --warn: #D97706; --warn-soft: #D9770615;
    --crit: #E11D48; --crit-soft: #E11D4815; --info: #0284C7; --info-soft: #0284C715;
    --violet: #7C3AED; --violet-soft: #7C3AED15; --shadow: 0 8px 24px -12px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  .tnum { font-variant-numeric: tabular-nums; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar { background: var(--elevated); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .brand .logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 700; }
  .brand .name { font-weight: 600; letter-spacing: -.01em; }
  .nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
  .nav-group { margin-bottom: 20px; }
  .nav-group > p { padding: 0 8px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; font-size: 14px; color: color-mix(in srgb, var(--fg) 80%, transparent); background: none; border: none; width: 100%; text-align: left; transition: background .12s; }
  .nav-item:hover { background: color-mix(in srgb, var(--border) 50%, transparent); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .nav-item .ico { width: 16px; text-align: center; color: var(--muted); }
  .nav-item.active .ico { color: var(--brand); }

  /* Topbar */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--elevated); position: sticky; top: 0; z-index: 20; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .crumbs .sel { padding: 4px 8px; border-radius: 6px; }
  .crumbs .sel:hover { background: color-mix(in srgb, var(--border) 50%, transparent); }
  .crumbs .div { color: var(--border); }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search { width: 240px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font-size: 14px; outline: none; }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-color: var(--brand); }
  .icon-btn { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--elevated); color: var(--fg); }
  .icon-btn:hover { background: color-mix(in srgb, var(--border) 40%, transparent); }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; border-radius: 999px; background: var(--crit); color: #fff; font-size: 10px; font-weight: 700; }
  .btn { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover { opacity: .92; }
  .btn-ghost { background: var(--elevated); border-color: var(--border); color: var(--fg); }
  .btn-ghost:hover { background: color-mix(in srgb, var(--border) 40%, transparent); }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Content */
  .content { padding: 28px 24px 64px; }
  .wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .page-head h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .page-head p { color: var(--muted); margin-top: 4px; font-size: 14px; }

  .card { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius); }
  .card-p { padding: 20px; }
  .card h2 { font-size: 14px; font-weight: 600; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, 1fr); }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 860px) { .g3, .g4 { grid-template-columns: repeat(2, 1fr); } .app { grid-template-columns: 1fr; } .sidebar { display: none; } }

  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .muted { color: var(--muted); }
  .sub { font-size: 12px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .p-brand { background: var(--brand-soft); color: var(--brand); }
  .p-ok { background: var(--ok-soft); color: var(--ok); }
  .p-warn { background: var(--warn-soft); color: var(--warn); }
  .p-crit { background: var(--crit-soft); color: var(--crit); }
  .p-info { background: var(--info-soft); color: var(--info); }
  .p-violet { background: var(--violet-soft); color: var(--violet); }
  .p-muted { background: color-mix(in srgb, var(--border) 60%, transparent); color: var(--muted); }

  .tile { background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .tile .k { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 6px; }
  .tile .d { font-size: 12px; margin-top: 4px; }

  .item { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .list > * + * { border-top: 1px solid var(--border); }
  .list .li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }

  .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .add-btn { border: 1px solid var(--border); background: none; color: var(--fg); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
  .add-btn:hover { background: var(--surface); }
  .empty { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 13px; }

  input.f, select.f, textarea.f { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); font-size: 14px; font-family: inherit; outline: none; }
  input.f:focus, select.f:focus, textarea.f:focus { border-color: var(--brand); }
  .field { display: flex; flex-direction: column; gap: 6px; }

  .scene { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: middle; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Full-screen public pages (login/register/review) */
  .app.fullscreen .sidebar, .app.fullscreen .topbar { display: none; }
  .app.fullscreen { grid-template-columns: 1fr; }
  .app.fullscreen .content { padding: 0; }
  .app.fullscreen .wrap { max-width: none; }
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--surface); }
  .auth-card { width: 100%; max-width: 400px; background: var(--elevated); border: 1px solid var(--border); border-radius: 16px; padding: 32px; box-shadow: var(--shadow); }
  .auth-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .auth-brand .logo { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 700; }
  .auth-brand .name { font-weight: 600; }
  .auth-title { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .auth-sub { color: var(--muted); margin-top: 4px; }
  .auth-alt { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .auth-alt a { color: var(--brand); font-weight: 500; cursor: pointer; }
  .review-wrap { min-height: 100vh; background: var(--surface); }
  .review-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--elevated); position: sticky; top: 0; }
  .review-body { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }
  .back-fab { position: fixed; top: 14px; left: 16px; z-index: 60; background: var(--elevated); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--fg); display: none; }
  .app.fullscreen ~ .back-fab { display: block; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 3px; }
  .seg button { border: none; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .seg button.on { background: var(--brand); color: #fff; }

  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }

  .bar-track { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--border) 70%, transparent); overflow: hidden; }
  .bar-fill { height: 100%; background: var(--brand); border-radius: 999px; }

  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .kv:last-child { border-bottom: none; }

  .banner { background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 30%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .note { font-size: 12px; color: var(--muted); }
  .demo-tag { position: fixed; bottom: 14px; right: 16px; z-index: 50; background: var(--elevated); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 12px; color: var(--muted); }
  .demo-tag b { color: var(--fg); }
</style>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand"><span class="logo">S</span><span class="name">SOIE</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumbs">
        <span class="sel">Beam Agência ▾</span><span class="div">/</span>

    <div class="content"><div class="wrap" id="screens"></div></div>

</div>

<button class="back-fab" id="backFab">← Voltar ao app</button>
<div class="demo-tag" id="demoTag">Protótipo estático — <b>SOIE</b> · frontend completo em 1 arquivo</div>

          <p style="margin-top:6px"><span class="muted">Visual:</span> ${v}</p>
          <p><span class="muted">Narração:</span> ${vo}</p>
          <p><span class="muted">Texto na tela:</span> ${t}</p></div>`).join("")}
        <div><span class="label">CTA</span><p style="margin-top:4px">Comenta 'QUERO' para receber a simulação de taxas.</p></div>
      </div>

      <div class="card card-p" style="margin-top:16px">
        <p class="label">O que você achou?</p>
        <div class="field" style="margin-top:10px"><span class="label">Seu nome (opcional)</span><input class="f" placeholder="Ex.: Marco"></div>
        <div class="field" style="margin-top:10px"><span class="label">Comentário (para ajustes)</span>
          <textarea class="f" rows="2" placeholder="Ex.: trocar o gancho da abertura, deixar o CTA mais direto…"></textarea></div>

// ---------- Build nav ----------
const navEl = document.getElementById("nav");
navEl.innerHTML = NAV.map(grp => `
  <div class="nav-group"><p>${grp.g}</p>
    ${grp.items.map(([id,label,ico]) => `<button class="nav-item" data-screen="${id}"><span class="ico">${ico}</span>${label}</button>`).join("")}
  </div>`).join("");

// ---------- Build screens ----------
const screensEl = document.getElementById("screens");
screensEl.innerHTML = Object.entries(SCREENS).map(([id,html]) =>
  `<div class="screen" id="s-${id}">${html}</div>`).join("");

const appEl = document.querySelector(".app");
function go(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === "s-"+id));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.screen === id));
  const full = FULLSCREEN.has(id);
  appEl.classList.toggle("fullscreen", full);
  document.getElementById("demoTag").style.display = full ? "none" : "";
  document.getElementById("backFab").style.display = full ? "block" : "none";
  window.scrollTo(0,0);
}
navEl.querySelectorAll(".nav-item").forEach(b => b.addEventListener("click", () => go(b.dataset.screen)));
document.getElementById("backFab").addEventListener("click", () => go("dashboard"));
// Links internos entre login/registro
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-goto]");
  if (t) { e.preventDefault(); go(t.dataset.goto); }
});
// Abas (seg) genéricas: alterna .on e mostra o painel correspondente
document.addEventListener("click", (e) => {
  const tab = e.target.closest(".seg[data-tabs] button[data-tab]");
  if (!tab) return;
  const group = tab.closest(".seg").dataset.tabs;
  tab.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === tab));
  document.querySelectorAll(`[data-panel="${group}"]`).forEach(p =>
    p.style.display = p.dataset.name === tab.dataset.tab ? "" : "none");
});
go("dashboard");

// ---------- Theme toggle ----------
const themeBtn = document.getElementById("themeBtn");
function setThemeIcon(){
  const dark = (document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light")) === "dark";
  themeBtn.textContent = dark ? "☀" : "☾";
}
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  setThemeIcon();
});
setThemeIcon();
</script>
