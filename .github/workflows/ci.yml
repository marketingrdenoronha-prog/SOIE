name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from package.json's
      # `packageManager` field. Specifying both errors with a version conflict.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @soie/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @soie/db validate

      # Build first: produces package dist and Next's generated types, so the
      # typecheck step below (which the web app needs .next/types for) passes.
      - name: Build (packages then apps, in dependency order)
        run: pnpm build

      - name: Typecheck (all packages and apps)
        run: |
          for pkg in config contracts ai queue db; do
            pnpm --filter @soie/$pkg exec tsc -p tsconfig.json --noEmit
          done
          pnpm --filter @soie/api exec tsc -p tsconfig.json --noEmit
          pnpm --filter @soie/worker exec tsc -p tsconfig.json --noEmit
          pnpm --filter @soie/web exec tsc --noEmit
