services:
  db:
    image: pgvector/pgvector:pg16
    container_name: soie-db
    environment:
      POSTGRES_USER: soie
      POSTGRES_PASSWORD: soie
      POSTGRES_DB: soie
    ports:
      - "5432:5432"
    volumes:
      - soie_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soie -d soie"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: soie-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - soie_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soie_db:
  soie_redis:
